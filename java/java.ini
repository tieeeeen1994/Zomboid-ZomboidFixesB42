# Zomboid Fixes B42, Java part: one line per fix. "true" turns it on; a missing line or any other value leaves it off.
# Read once at game start. Your copy lives in <game folder>/ZomboidFixesB42/java.ini.

# The crafting window's recipe cache no longer grows by ~670 dead entries every time it refreshes.
HandcraftRecipeCacheLeak=true

# Crafting checks (crafting window, every finished craft) only look at the items each recipe line can use,
# instead of comparing every nearby item against every accepted type.
CraftInputItems=true
